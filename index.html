<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Atlas: aprende el stack moderno de IA con un mapa interactivo, labs y trazas reales." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08080b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="AI Atlas" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI Atlas</title>
    <script>
      try {
        var t = localStorage.getItem('atlas-theme')
        if (t === 'light') document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Cloudflare Pages + Workers configuration
# Docs: https://developers.cloudflare.com/pages/functions/

name = "ai-atlas"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# El Worker que protege todos los requests con auth de Supabase
# Se compila desde worker/auth.ts y se despliega como Pages Function
[site]
bucket = "./dist"

# Variables de entorno para producción — configúralas en el dashboard de
# Cloudflare Pages (Settings → Environment variables) como secretos cifrados:
#   SUPABASE_URL        https://xxxx.supabase.co
#   SUPABASE_ANON_KEY   eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
#   SUPABASE_JWT_SECRET lo encuentras en Supabase → Project Settings → API → JWT Secret
#
# NO añadas valores reales aquí — este fichero se sube al repo.
[vars]
ENVIRONMENT = "production"

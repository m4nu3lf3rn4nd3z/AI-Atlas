<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>AI Atlas</title>
    <script>
      // SPA redirect for GitHub Pages project repos (segmentCount = 1 for /ai-atlas/).
      // Encodes the path as a query param so GH Pages serves index.html which
      // then decodes it back via history.replaceState (see index.html script).
      var segmentCount = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
